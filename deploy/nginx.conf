# iangame.com Nginx 配置
# 用法:sudo cp deploy/nginx.conf /etc/nginx/sites-available/iangame
#       sudo ln -sf /etc/nginx/sites-available/iangame /etc/nginx/sites-enabled/iangame
#       sudo rm -f /etc/nginx/sites-enabled/default
#       sudo nginx -t && sudo systemctl reload nginx

# 后端 Gunicorn 上游(固定步长,匹配 2 核小机)
upstream iangame_backend {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name iangame.com www.iangame.com;

    # 静态文件根(Flask 静态目录)—— 由 Nginx 直出,减轻后端压力
    root /usr/local/coneworkspace/iangame/static;

    # 上传体积限制
    client_max_body_size 4m;

    # 静态资源:长缓存(带 hash 时可改 1y;此处保守 1h 便于迭代)
    location /static/ {
        alias /usr/local/coneworkspace/iangame/static/;
        expires 1h;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # 健康检查
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 其余请求反代给 Gunicorn
    location / {
        proxy_pass http://iangame_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 日志
    access_log /var/log/nginx/iangame_access.log;
    error_log  /var/log/nginx/iangame_error.log;
}
