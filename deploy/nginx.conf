# iangame.com Nginx 配置
# 用法:sudo cp deploy/nginx*.conf /etc/nginx/sites-available/
#       (deploy.sh 已自动处理:把两个文件都 cp 到 sites-available)
#       sudo ln -sf /etc/nginx/sites-available/iangame /etc/nginx/sites-enabled/iangame
#       sudo rm -f /etc/nginx/sites-enabled/default
#       sudo nginx -t && sudo systemctl reload nginx
#
# 注意:安全头抽到 nginx-security.conf,在各 location 用 include 引入
#       (Nginx 的 add_header 不跨 location 继承,必须显式 include)

upstream iangame_backend {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name iangame.com www.iangame.com;

    root /usr/local/coneworkspace/iangame/static;
    client_max_body_size 4m;

    # 隐藏 Nginx 版本号(低危:信息泄露)
    server_tokens off;

    # 静态资源:Nginx 直出
    location /static/ {
        alias /usr/local/coneworkspace/iangame/static/;
        # no-cache:允许 CF/浏览器缓存,但每次回源校验 ETag/Last-Modified
        # 内容变了立即生效,迭代时无需手动清缓存
        add_header Cache-Control "no-cache";
        etag on;
        include /etc/nginx/sites-available/nginx-security.conf;
        access_log off;
        try_files $uri =404;
    }

    # 健康检查
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 其余请求反代给 Gunicorn
    location / {
        proxy_pass http://iangame_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        include /etc/nginx/sites-available/nginx-security.conf;
    }

    access_log /var/log/nginx/iangame_access.log;
    error_log  /var/log/nginx/iangame_error.log;
}
